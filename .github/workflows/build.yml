name: Build QuiteRSS

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            mesa-common-dev \
            libxkbcommon-x11-0 \
            libnss3 \
            libasound2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libdbus-1-3 \
            libegl1 \
            libpulse-dev

      - name: Install Qt (with QtWebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtwebengine'
          cache: true

      - name: Run qmake
        run: |
          qmake QuiteRSS.pro CONFIG+=release

      - name: Build
        run: |
          # GitHub Actions runs bash with -e -o pipefail by default; the
          # pipeline below would abort the script before diagnostics if
          # make fails, so disable errexit around it.
          set +e
          make -j$(nproc) 2>&1 | tee build.log
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo "::error::DBG make_status=$status log_lines=$(wc -l < build.log 2>/dev/null || echo 0)"
            echo "::error::B64_$(base64 -w0 build.log | head -c 50000)"
          fi
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: build.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-linux
          path: release/target/QuiteRSS
          if-no-files-found: warn

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Run qmake
        run: |
          qmake QuiteRSS.pro -spec win32-msvc "CONFIG+=release"
        shell: cmd

      - name: Build
        shell: pwsh
        run: |
          nmake *>&1 | Tee-Object -FilePath build.log | Out-Host
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path build.log)))
            Write-Output ("::error::B64_" + $b64.Substring(0, [Math]::Min(50000, $b64.Length)))
            Select-String -Path build.log -Pattern 'error|LNK[0-9]+|fatal' | Select-Object -First 30 | ForEach-Object {
              Write-Output ("::error::" + $_.Line)
            }
            Get-Content build.log -Tail 40 | ForEach-Object {
              Write-Output ("::error::" + $_)
            }
          }
          exit $status

      - name: Deploy Qt runtime (windeployqt)
        shell: pwsh
        run: |
          $exe = "release/target/QuiteRSS.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "QuiteRSS.exe not found: $exe"
            exit 1
          }
          # install-qt-action prepends the Qt bin dir to PATH, so
          # windeployqt is callable directly.
          windeployqt.exe --release --compiler-runtime $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release/target | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Output

      - name: Package Windows distribution
        shell: pwsh
        run: |
          Compress-Archive -Path release/target/* -DestinationPath QuiteRSS-windows.zip -Force
          Get-Item QuiteRSS-windows.zip | Select-Object Name, Length

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: build.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-windows
          path: QuiteRSS-windows.zip
          if-no-files-found: warn

  release:
    # Only create a GitHub Release when a tag like v0.19.4 is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: QuiteRSS-windows
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuiteRSS-windows.zip
          generate_release_notes: true
          draft: false
