name: Build QuiteRSS

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            mesa-common-dev \
            libxkbcommon-x11-0 \
            libnss3 \
            libasound2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libdbus-1-3 \
            libegl1 \
            libpulse-dev

      - name: Install Qt (with QtWebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtwebengine'
          cache: true

      - name: Run qmake
        run: |
          qmake QuiteRSS.pro CONFIG+=release

      - name: Build
        run: |
          # GitHub Actions runs bash with -e -o pipefail by default; the
          # pipeline below would abort the script before diagnostics if
          # make fails, so disable errexit around it. Use PIPESTATUS so
          # `status` reflects make's exit code, not tee's.
          set +e
          make -j$(nproc) 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            echo "::error::DBG make_status=$status log_lines=$(wc -l < build.log 2>/dev/null || echo 0)"
            grep -nE 'error:|undefined reference|collect2:|fatal error' build.log | head -40 | while IFS= read -r l; do
              echo "::error::$l"
            done
            tail -40 build.log | while IFS= read -r l; do
              echo "::error::$l"
            done
          fi
          exit $status

      - name: Build and run unit tests
        run: |
          mkdir -p build-tests && cd build-tests
          qmake ../tests/tests.pro CONFIG+=release
          set +e
          make -j$(nproc) 2>&1 | tee test-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            echo "::error::DBG_TEST make_status=$status"
            grep -nE 'error:|undefined reference|collect2:|fatal error' test-build.log | head -40 | while IFS= read -r l; do
              echo "::error::$l"
            done
            tail -40 test-build.log | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit $status
          fi
          ./tst_common

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: build.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-linux
          path: release/target/QuiteRSS
          if-no-files-found: warn

  # Qt6 matrix leg: catches Qt5-only API usage that would silently rot the
  # codebase. Kept separate from build-linux so a Qt6-only failure does not
  # block the stable Qt5 artifacts.
  build-linux-qt6:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            mesa-common-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libnss3 \
            libasound2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libdbus-1-3 \
            libegl1 \
            libpulse-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0

      - name: Install Qt 6 (with QtWebEngine and Qt5Compat)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtwebengine qt5compat'
          cache: true

      - name: Run qmake
        run: |
          qmake QuiteRSS.pro CONFIG+=release

      - name: Build
        run: |
          set +e
          make -j$(nproc) 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            echo "::error::DBG_QT6 make_status=$status log_lines=$(wc -l < build.log 2>/dev/null || echo 0)"
            grep -nE 'error:|undefined reference|collect2:|fatal error' build.log | head -60 | while IFS= read -r l; do
              echo "::error::$l"
            done
            tail -40 build.log | while IFS= read -r l; do
              echo "::error::$l"
            done
          fi
          exit $status

      - name: Build and run unit tests
        run: |
          mkdir -p build-tests && cd build-tests
          qmake ../tests/tests.pro CONFIG+=release
          set +e
          make -j$(nproc) 2>&1 | tee test-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            echo "::error::DBG_TEST_QT6 make_status=$status"
            grep -nE 'error:|undefined reference|collect2:|fatal error' test-build.log | head -60 | while IFS= read -r l; do
              echo "::error::$l"
            done
            tail -40 test-build.log | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit $status
          fi
          ./tst_common

      - name: Upload build log (Qt6)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-qt6
          path: build.log
          if-no-files-found: ignore

      - name: Upload artifact (Qt6)
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-linux-qt6
          path: release/target/QuiteRSS
          if-no-files-found: warn

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Run qmake
        run: |
          qmake QuiteRSS.pro -spec win32-msvc "CONFIG+=release"
        shell: cmd

      - name: Build
        shell: pwsh
        run: |
          # Avoid the PowerShell pipeline $LASTEXITCODE bug: it returns the exit
          # code of the LAST cmdlet (Out-Host=0) not the first executable (nmake).
          # Run nmake directly, tee its output to file, then check $LASTEXITCODE.
          nmake *>&1 | Tee-Object -FilePath build.log
          $status = $LASTEXITCODE
          Get-Content build.log | Out-Host  # stream to console after
          if ($status -ne 0) {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path build.log)))
            Write-Output ("::error::B64_" + $b64.Substring(0, [Math]::Min(50000, $b64.Length)))
            Select-String -Path build.log -Pattern 'error|LNK[0-9]+|fatal' | Select-Object -First 30 | ForEach-Object {
              Write-Output ("::error::" + $_.Line)
            }
            Get-Content build.log -Tail 40 | ForEach-Object {
              Write-Output ("::error::" + $_)
            }
          }
          exit $status

      - name: Build and run unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-tests | Out-Null
          Set-Location build-tests
          qmake ..\tests\tests.pro "CONFIG+=release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nmake *>&1 | Tee-Object -FilePath test-build.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Output "::error::DBG_TEST nmake_status=$status"
            Select-String -Path test-build.log -Pattern 'error|LNK[0-9]+|fatal' | Select-Object -First 30 | ForEach-Object {
              Write-Output ("::error::" + $_.Line)
            }
            Get-Content test-build.log -Tail 40 -Encoding UTF8 | ForEach-Object {
              Write-Output ("::error::" + $_)
            }
            exit $status
          }
          .\tst_common.exe
          exit $LASTEXITCODE

      - name: Deploy Qt runtime (windeployqt)
        shell: pwsh
        run: |
          # Use absolute path to avoid any working-directory confusion.
          $workspace = $PSScriptRoot
          $exe = Join-Path $workspace "release\target\QuiteRSS.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "QuiteRSS.exe not found at: $exe"
            # Show what's in release/target for debugging
            Get-ChildItem (Join-Path $workspace "release\target") -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "  $_" }
            exit 1
          }
          # install-qt-action prepends the Qt bin dir to PATH, so
          # windeployqt is callable directly.
          windeployqt.exe --release --compiler-runtime $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem (Join-Path $workspace "release\target") | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Output

      - name: Deploy OpenSSL 1.1.1 runtime (required for HTTPS feeds)
        shell: pwsh
        run: |
          # Qt 5.15 requires OpenSSL 1.1.x. windeployqt does NOT copy
          # libssl/libcrypto automatically, so every https:// feed fails
          # with "TLS initialization failed" without these DLLs. Provision
          # them next to QuiteRSS.exe.
          $ErrorActionPreference = 'Stop'
          $workspace = $PSScriptRoot
          $targetDir = Join-Path $workspace "release\target"
          $sslLib = Join-Path $targetDir "libssl-1_1-x64.dll"
          $cryptoLib = Join-Path $targetDir "libcrypto-1_1-x64.dll"

          # 1) The Qt installation may already ship OpenSSL (some Qt 5.15
          #    distributions bundle it in bin/ or Tools/QtCreator/bin/).
          $qtBin = (Get-Command qmake.exe).Source | Split-Path
          $candidateDirs = @($qtBin, (Join-Path $qtBin "..\Tools\QtCreator\bin"))
          foreach ($dir in $candidateDirs) {
            $ssl = Join-Path $dir "libssl-1_1-x64.dll"
            $crypto = Join-Path $dir "libcrypto-1_1-x64.dll"
            if ((Test-Path $ssl) -and (Test-Path $crypto)) {
              Write-Output "Copying OpenSSL DLLs from: $dir"
              Copy-Item $ssl $targetDir
              Copy-Item $crypto $targetDir
              break
            }
          }

          # 2) Fallback: download Win64 OpenSSL Light 1.1.1w installer from
          #    Shining Light Productions and extract the runtime DLLs.
          if (-not (Test-Path $sslLib)) {
            Write-Output "Downloading Win64 OpenSSL Light 1.1.1w installer"
            $exe = "Win64OpenSSL_Light-1_1_1w.exe"
            Invoke-WebRequest -Uri "https://slproweb.com/download/$exe" -OutFile $exe
            # Silent install to a known prefix, then copy the DLLs.
            Start-Process -FilePath ".\$exe" -ArgumentList "/silent", "/verysilent", "/dir=$env:USERPROFILE\openssl-1_1_1w", "/suppressmsgboxes", "/norestart" -Wait
            $installedBin = Join-Path $env:USERPROFILE "openssl-1_1_1w\bin"
            Copy-Item (Join-Path $installedBin "libssl-1_1-x64.dll") $targetDir
            Copy-Item (Join-Path $installedBin "libcrypto-1_1-x64.dll") $targetDir
          }

          if ((Test-Path $sslLib) -and (Test-Path $cryptoLib)) {
            Write-Output "OpenSSL DLLs deployed:"
            Get-Item $sslLib, $cryptoLib | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Output
          } else {
            Write-Error "Failed to provision OpenSSL DLLs"
            exit 1
          }

      - name: Generate and package translation files
        shell: pwsh
        run: |
          # GitHub Actions' pwsh defaults $ErrorActionPreference to 'stop',
          # which turns any native-command stderr into a fatal error on
          # pwsh >= 7.3 ($PSNativeCommandUseErrorActionPreference). We check
          # exit codes explicitly instead.
          $ErrorActionPreference = 'Continue'
          $langDir = "release/target/lang"
          New-Item -ItemType Directory -Force $langDir | Out-Null

          # Locate lrelease.exe (it lives in the same Qt bin dir as windeployqt).
          $lreleaseCmd = Get-Command lrelease.exe -ErrorAction SilentlyContinue
          if (-not $lreleaseCmd) {
            Write-Output "::error::lrelease.exe not found in PATH"
            exit 1
          }
          Write-Output "Using lrelease: $($lreleaseCmd.Source)"

          # Compile the application translations (.ts -> .qm). lrelease puts
          # the .qm files next to their .ts sources, then we copy them into
          # the distribution next to QuiteRSS.exe so that
          # MainApplication::setTranslateApplication() can find them at
          # "<exe dir>/lang/quiterss_<lang>.qm".
          $tsFiles = @(Get-ChildItem -Path lang -Filter quiterss_*.ts | Sort-Object Name)
          Write-Output "Compiling $($tsFiles.Count) .ts files"
          & $lreleaseCmd.Source @($tsFiles.FullName) 2>&1 | Tee-Object -FilePath lrelease.log
          $lr = $LASTEXITCODE
          if ($lr -ne 0) {
            Write-Output "::error::lrelease exited with code $lr"
            Select-String -Path lrelease.log -Pattern 'error|Error|cannot|unable|failed' |
              Select-Object -First 20 | ForEach-Object {
                Write-Output ("::error::" + $_.Line)
              }
            exit $lr
          }

          # Copy the generated .qm files next to the exe.
          $qm = @(Get-ChildItem -Path lang -Filter quiterss_*.qm -ErrorAction SilentlyContinue)
          if ($qm.Count -eq 0) {
            Write-Output "::error::no .qm files generated in lang/"
            exit 1
          }
          Copy-Item $qm.FullName $langDir
          Write-Output "Copied $($qm.Count) .qm files"

          # Copy Qt's own translations (standard buttons, dialogs) from the
          # windeployqt output into lang/ as well.
          if (Test-Path "release/target/translations/qtbase_zh_CN.qm") {
            Copy-Item release/target/translations/qtbase_*.qm $langDir
          }
          Get-ChildItem $langDir | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Output

      - name: Package Windows distribution
        shell: pwsh
        run: |
          Compress-Archive -Path release/target/* -DestinationPath QuiteRSS-windows.zip -Force
          Get-Item QuiteRSS-windows.zip | Select-Object Name, Length

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: build.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-windows
          path: QuiteRSS-windows.zip
          if-no-files-found: warn

  release:
    # Only create a GitHub Release when a tag like v0.19.4 is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: QuiteRSS-windows
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuiteRSS-windows.zip
          generate_release_notes: true
          draft: false
