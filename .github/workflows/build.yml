name: Build QuiteRSS

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt5 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            libqt5webengine5-dev \
            libqt5webchannel5-dev \
            qtmultimedia5-dev \
            libqt5xml5 \
            libqt5sql5 \
            libqt5network5 \
            libqt5printsupport5 \
            qttools5-dev \
            libgl1-mesa-dev

      - name: Run qmake
        run: |
          qmake QuiteRSS.pro CONFIG+=release

      - name: Build
        run: |
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-linux
          path: release/target/QuiteRSS
          if-no-files-found: warn

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Run qmake
        run: |
          qmake QuiteRSS.pro -spec win32-msvc "CONFIG+=release"
        shell: cmd

      - name: Build
        run: |
          nmake
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-windows
          path: |
            release/target/QuiteRSS.exe
            release/target/*.dll
          if-no-files-found: warn
