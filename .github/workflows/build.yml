name: Build QuiteRSS

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            mesa-common-dev \
            libxkbcommon-x11-0 \
            libnss3 \
            libasound2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libdbus-1-3 \
            libegl1 \
            libpulse-dev

      - name: Install Qt (with QtWebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtwebengine'
          cache: true

      - name: Run qmake
        run: |
          qmake QuiteRSS.pro CONFIG+=release

      - name: Build
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log
          status=$?
          if [ $status -ne 0 ]; then
            {
              echo "## Build failed - last 60 lines"
              echo '```'
              tail -60 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -60 build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: build.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-linux
          path: release/target/QuiteRSS
          if-no-files-found: warn

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Run qmake
        run: |
          qmake QuiteRSS.pro -spec win32-msvc "CONFIG+=release"
        shell: cmd

      - name: Build
        shell: pwsh
        run: |
          nmake *>&1 | Tee-Object -FilePath build.log | Out-Host
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $tail = Get-Content build.log -Tail 60
            $summary = @("## Build failed - last 60 lines", '```')
            $summary += $tail
            $summary += '```'
            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $tail | ForEach-Object {
              Write-Output ("::error::" + $_)
            }
          }
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: build.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-windows
          path: |
            release/target/QuiteRSS.exe
            release/target/*.dll
          if-no-files-found: warn
