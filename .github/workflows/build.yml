name: Build QuiteRSS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2019
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Qt 5.6.3 (自带 QtWebKit，无需手动指定 modules)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw49'

      - name: 编译
        shell: cmd
        run: |
          qmake quiterss.pro
          mingw32-make -j4

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-Windows
          path: release/

  build-ubuntu:
    runs-on: ubuntu-22.04  # 改用 22.04，兼容性最好
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y qt5-default qtbase5-dev libqt5webkit5-dev \
            libqt5sql5-sqlite qttools5-dev-tools qtmultimedia5-dev \
            libqt5multimedia5-plugins libqt5svg5-dev

      - name: 编译
        run: |
          qmake quiterss.pro
          make -j4

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-Ubuntu
          path: release/
