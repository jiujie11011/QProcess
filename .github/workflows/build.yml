name: Build QuiteRSS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          modules: 'qtwebengine qtwebkit'

      - name: 编译
        shell: cmd
        run: |
          qmake quiterss.pro
          mingw32-make -j4

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-Windows
          path: release/

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y qt5-default qtwebengine5-dev libqt5webkit5-dev build-essential

      - name: 编译
        run: |
          qmake quiterss.pro
          make -j4

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-Linux
          path: release/
