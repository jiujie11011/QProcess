name: Build QuiteRSS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2019
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 1. 安装 Qt 5.9.9（这个老版本自带了比较完整的组件，不写 modules 避免去下载不存在的包）
      - name: 安装 Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.9.9'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw73'

      # 2. 执行编译
      - name: 编译
        shell: cmd
        run: |
          qmake quiterss.pro
          mingw32-make -j4

      # 3. 编译成功后，打包上传产物
      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: QuiteRSS-Windows-Build
          path: |
            release/*.exe
            release/*.dll
